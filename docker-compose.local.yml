name: komunicare-public-local

services:
  api:
    container_name: komunicare-api-public-local
    build:
      context: .
      dockerfile: Dockerfile
    image: komunicare-api-public-local
    env_file:
      - .env.local
    environment:
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_FROM: info@komuni.care
      KOMUNICARE_URL: http://localhost:3001
      BACKOFFICE_URL: http://localhost:3001
      NODE_ENV: development
      DEV_ENV_WITH_HTTPS: ${DEV_ENV_WITH_HTTPS:-0}
      PORT: 10011
    ports:
      - "10011:10011"
    depends_on:
      - mailhog
    restart: unless-stopped

  mailhog:
    container_name: komunicare-mailhog
    image: mailhog/mailhog:latest
    ports:
      - "8026:8025"
    restart: unless-stopped
